<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Tracker</title>
  <style>
    :root {
      --page: #eef3f8;
      --page-2: #f8fbff;
      --ink: #101828;
      --muted: #667085;
      --soft: #f6f8fb;
      --surface: #ffffff;
      --surface-dark: #111827;
      --line: #d8e0ec;
      --line-dark: rgba(255, 255, 255, 0.16);
      --accent: #0f6fff;
      --accent-dark: #0759d1;
      --green: #14a46c;
      --green-ink: #07532f;
      --red: #dc2626;
      --red-ink: #8f1f1f;
      --process-row: #ffe7e7;
      --process-soft: #fff5f5;
      --done-row: #dff8eb;
      --done-soft: #f0fff7;
      --shadow: 0 24px 70px rgba(16, 24, 40, 0.14);
      --small-shadow: 0 12px 28px rgba(16, 24, 40, 0.10);
      --radius: 8px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-width: 320px;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        linear-gradient(180deg, #f9fbff 0, var(--page) 48%, #e8eef5 100%);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body::before {
      position: fixed;
      inset: 0 0 auto;
      z-index: -1;
      height: 265px;
      content: "";
      background:
        linear-gradient(120deg, #0b1020 0%, #16243c 44%, #103d4b 100%);
    }

    .app {
      width: min(1540px, calc(100% - 32px));
      margin: 0 auto;
      padding: 24px 0 34px;
    }

    .topbar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(340px, 520px);
      gap: 22px;
      align-items: stretch;
      margin-bottom: 16px;
      padding: 24px;
      overflow: hidden;
      color: #ffffff;
      border: 1px solid var(--line-dark);
      border-radius: var(--radius);
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.09), rgba(255, 255, 255, 0.02)),
        linear-gradient(135deg, rgba(12, 18, 35, 0.98), rgba(26, 44, 68, 0.95));
      box-shadow: var(--shadow);
    }

    .brand-kicker {
      display: inline-flex;
      align-items: center;
      width: fit-content;
      min-height: 28px;
      margin: 0 0 12px;
      padding: 0 11px;
      color: #c7f9e5;
      border: 1px solid rgba(199, 249, 229, 0.28);
      border-radius: 999px;
      background: rgba(20, 164, 108, 0.13);
      font-size: 0.76rem;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 760px;
      margin: 0;
      color: #ffffff;
      font-size: clamp(2rem, 4vw, 4.2rem);
      line-height: 0.95;
      letter-spacing: 0;
    }

    .hero-subline {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin-top: 18px;
    }

    .hero-chip {
      display: inline-flex;
      align-items: center;
      min-height: 32px;
      padding: 0 11px;
      color: #dbe7ff;
      border: 1px solid rgba(219, 231, 255, 0.18);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.07);
      font-size: 0.83rem;
      font-weight: 800;
      white-space: nowrap;
    }

    .progress-card {
      display: grid;
      align-content: space-between;
      gap: 18px;
      min-height: 100%;
      padding: 18px;
      border: 1px solid var(--line-dark);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.08);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(14px);
    }

    .progress-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 18px;
    }

    .progress-label {
      color: #cbd5e1;
      font-size: 0.78rem;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    #completionRate {
      color: #ffffff;
      font-size: clamp(2rem, 4vw, 3.3rem);
      line-height: 0.95;
      font-weight: 950;
    }

    .progress-track {
      flex: 1;
      min-width: 140px;
      width: 100%;
      height: 11px;
      margin-bottom: 9px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
    }

    .progress-track span {
      display: block;
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #3b82f6, #22c55e);
      transition: width 220ms ease;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      color: #ffffff;
      font-weight: 800;
      font-size: 0.88rem;
    }

    .stat {
      display: grid;
      gap: 8px;
      min-height: 76px;
      padding: 13px;
      border: 1px solid var(--line-dark);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.08);
      white-space: nowrap;
    }

    .dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 4px rgba(15, 111, 255, 0.14);
    }

    .dot.red {
      background: #ff5a5a;
      box-shadow: 0 0 0 4px rgba(255, 90, 90, 0.16);
    }

    .dot.green {
      background: #26d784;
      box-shadow: 0 0 0 4px rgba(38, 215, 132, 0.16);
    }

    .toolbar {
      position: sticky;
      top: 12px;
      z-index: 8;
      display: grid;
      grid-template-columns: minmax(280px, 520px) auto;
      gap: 12px;
      align-items: center;
      margin-bottom: 14px;
      padding: 12px;
      border: 1px solid rgba(216, 224, 236, 0.94);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.92);
      box-shadow: var(--small-shadow);
      backdrop-filter: blur(16px);
    }

    .search-wrap {
      position: relative;
      width: 100%;
    }

    .search-wrap::before {
      position: absolute;
      top: 50%;
      left: 15px;
      width: 12px;
      height: 12px;
      border: 2px solid #8a98ab;
      border-radius: 50%;
      content: "";
      transform: translateY(-57%);
      pointer-events: none;
    }

    .search-wrap::after {
      position: absolute;
      top: 25px;
      left: 27px;
      width: 8px;
      height: 2px;
      border-radius: 99px;
      background: #8a98ab;
      content: "";
      transform: rotate(45deg);
      pointer-events: none;
    }

    .search {
      width: 100%;
      height: 44px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 0 14px 0 42px;
      background: #f8fafc;
      color: var(--ink);
      font: inherit;
      font-weight: 700;
      outline: none;
    }

    .search::placeholder,
    input::placeholder,
    textarea::placeholder {
      color: #98a2b3;
    }

    .search:focus,
    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(15, 111, 255, 0.14);
    }

    .actions {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    button {
      min-height: 44px;
      border: 0;
      border-radius: var(--radius);
      padding: 0 15px;
      background: linear-gradient(180deg, #1778ff, var(--accent-dark));
      color: #ffffff;
      font: inherit;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 12px 24px rgba(15, 111, 255, 0.26);
      transition: transform 160ms ease, box-shadow 160ms ease, background 160ms ease;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 16px 30px rgba(15, 111, 255, 0.30);
    }

    button:active {
      transform: translateY(0);
      box-shadow: 0 8px 18px rgba(15, 111, 255, 0.20);
    }

    button.secondary {
      border: 1px solid var(--line);
      background: #ffffff;
      color: #344054;
      box-shadow: none;
    }

    button.secondary:hover {
      border-color: #b8c3d4;
      box-shadow: 0 12px 24px rgba(16, 24, 40, 0.10);
    }

    #clearBtn {
      color: #a11d1d;
    }

    .table-shell {
      overflow: auto;
      border: 1px solid rgba(216, 224, 236, 0.98);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    table {
      width: 100%;
      min-width: 1300px;
      border-collapse: separate;
      border-spacing: 0;
    }

    thead th {
      position: sticky;
      top: 0;
      z-index: 2;
      padding: 15px 12px;
      color: #dbe7ff;
      border-bottom: 1px solid rgba(255, 255, 255, 0.11);
      background: #111827;
      text-align: left;
      font-size: 0.76rem;
      font-weight: 950;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    thead th:first-child {
      border-top-left-radius: var(--radius);
    }

    thead th:last-child {
      border-top-right-radius: var(--radius);
    }

    tbody tr {
      background: #ffffff;
      transition: background 160ms ease, box-shadow 160ms ease;
    }

    tbody tr:hover {
      box-shadow: inset 0 0 0 999px rgba(15, 111, 255, 0.035);
    }

    tbody tr[data-status="under-process"] {
      background: var(--process-row);
    }

    tbody tr[data-status="completed"] {
      background: var(--done-row);
    }

    tbody td {
      padding: 13px 12px;
      border-bottom: 1px solid var(--line);
      background: inherit;
      vertical-align: top;
    }

    tbody td:first-child {
      border-left: 5px solid transparent;
    }

    tbody tr[data-status="under-process"] td {
      border-bottom-color: #f3b2b2;
    }

    tbody tr[data-status="under-process"] td:first-child {
      border-left-color: var(--red);
    }

    tbody tr[data-status="completed"] td {
      border-bottom-color: #9fdcb8;
    }

    tbody tr[data-status="completed"] td:first-child {
      border-left-color: var(--green);
    }

    tbody tr:last-child td {
      border-bottom: 0;
    }

    .col-idea,
    .col-channel,
    .col-title {
      width: 210px;
    }

    .col-content {
      width: 230px;
    }

    .col-link {
      width: 190px;
    }

    .col-thumb {
      width: 245px;
    }

    .col-upload,
    .col-status {
      width: 165px;
    }

    .col-action {
      width: 82px;
    }

    input,
    select,
    textarea {
      width: 100%;
      min-width: 0;
      border: 1px solid rgba(152, 162, 179, 0.46);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.88);
      color: var(--ink);
      font: inherit;
      font-size: 0.91rem;
      outline: none;
      transition: border-color 160ms ease, box-shadow 160ms ease, background 160ms ease;
    }

    input:hover,
    select:hover,
    textarea:hover {
      border-color: #a9b5c6;
      background: #ffffff;
    }

    input,
    select {
      height: 40px;
      padding: 0 11px;
    }

    select {
      appearance: none;
      background-image:
        linear-gradient(45deg, transparent 50%, #667085 50%),
        linear-gradient(135deg, #667085 50%, transparent 50%);
      background-position:
        calc(100% - 16px) 17px,
        calc(100% - 11px) 17px;
      background-size: 5px 5px, 5px 5px;
      background-repeat: no-repeat;
      padding-right: 30px;
      font-weight: 850;
    }

    select option {
      color: #101010;
      background: #fff8e8;
      font-weight: 800;
    }

    select option:checked {
      color: #050505;
      background: #d7a229;
      font-weight: 950;
    }

    select option[value="__add_new_type__"] {
      color: #8b1010;
      background: #fff1d1;
      font-weight: 950;
    }

    textarea {
      display: block;
      min-height: 84px;
      resize: vertical;
      padding: 10px 11px;
      line-height: 1.38;
      font-weight: 650;
    }

    .link-wrap {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 42px;
      gap: 8px;
    }

    .open-link,
    .remove-row {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 42px;
      min-width: 42px;
      height: 40px;
      min-height: 40px;
      padding: 0;
      border: 1px solid rgba(152, 162, 179, 0.48);
      border-radius: var(--radius);
      background: #ffffff;
      color: #344054;
      text-decoration: none;
      font-size: 0.78rem;
      font-weight: 950;
      box-shadow: none;
    }

    .open-link:hover {
      color: #ffffff;
      border-color: var(--accent);
      background: var(--accent);
    }

    .remove-row {
      color: #b42318;
      cursor: pointer;
    }

    .remove-row:hover {
      color: #ffffff;
      border-color: var(--red);
      background: var(--red);
      box-shadow: 0 12px 22px rgba(220, 38, 38, 0.20);
    }

    .thumb-control {
      display: grid;
      gap: 9px;
    }

    .thumb-url {
      font-size: 0.83rem;
    }

    .thumb-url.has-image::placeholder {
      color: var(--accent);
      opacity: 1;
    }

    .thumb-file {
      height: auto;
      min-height: 40px;
      padding: 7px;
      color: #475467;
      background: rgba(255, 255, 255, 0.86);
      font-size: 0.84rem;
      font-weight: 800;
    }

    .thumb-file::file-selector-button {
      min-height: 26px;
      margin-right: 8px;
      border: 0;
      border-radius: 6px;
      padding: 0 9px;
      color: #ffffff;
      background: #111827;
      font: inherit;
      font-size: 0.78rem;
      font-weight: 900;
      cursor: pointer;
    }

    .thumb-preview {
      position: relative;
      display: grid;
      place-items: center;
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      border: 1px solid rgba(17, 24, 39, 0.16);
      border-radius: var(--radius);
      background:
        linear-gradient(135deg, #0f172a, #1f2937 54%, #0f3b46);
      color: #dbe7ff;
      font-size: 0.82rem;
      font-weight: 950;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.06);
    }

    .thumb-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .status-select {
      font-weight: 950;
    }

    tr[data-status="under-process"] .status-select {
      color: var(--red-ink);
      border-color: #e59b9b;
      background-color: var(--process-soft);
    }

    tr[data-status="completed"] .status-select {
      color: var(--green-ink);
      border-color: #7fd0a2;
      background-color: var(--done-soft);
    }

    .empty {
      display: none;
      padding: 56px 18px;
      color: var(--muted);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      text-align: center;
      font-weight: 900;
      box-shadow: var(--shadow);
    }

    .empty.show {
      display: block;
    }

    @media (max-width: 980px) {
      .topbar {
        grid-template-columns: 1fr;
      }

      .toolbar {
        grid-template-columns: 1fr;
      }

      .actions {
        justify-content: flex-start;
      }
    }

    @media (max-width: 760px) {
      .app {
        width: min(100% - 20px, 1540px);
        padding: 14px 0 24px;
      }

      .topbar {
        padding: 18px;
      }

      h1 {
        font-size: clamp(2rem, 11vw, 3.2rem);
      }

      .progress-head {
        align-items: flex-start;
      }

      .stats {
        grid-template-columns: 1fr;
      }

      .actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
      }

      .actions button,
      .search {
        width: 100%;
      }

      .actions button:first-child {
        grid-column: 1 / -1;
      }
    }

    @media (max-width: 520px) {
      .progress-head {
        flex-direction: column;
        align-items: stretch;
      }

      .progress-track {
        min-width: 0;
        margin-bottom: 0;
      }

      .hero-subline {
        display: grid;
        grid-template-columns: 1fr 1fr;
      }

      .hero-chip {
        justify-content: center;
      }
    }

    body {
      color: #f6efe1;
      background:
        repeating-linear-gradient(135deg, rgba(255, 255, 255, 0.025) 0 1px, transparent 1px 13px),
        linear-gradient(180deg, #070707 0%, #101010 44%, #18100d 100%);
    }

    body::before {
      height: 330px;
      background:
        repeating-linear-gradient(135deg, rgba(255, 255, 255, 0.04) 0 2px, transparent 2px 18px),
        linear-gradient(118deg, #050505 0%, #220707 46%, #090909 100%);
      box-shadow: inset 0 -80px 120px rgba(0, 0, 0, 0.66);
    }

    .app {
      width: min(1660px, calc(100% - 32px));
    }

    .topbar {
      position: relative;
      grid-template-columns: minmax(0, 1.2fr) minmax(340px, 520px);
      border-color: rgba(215, 162, 41, 0.42);
      background:
        repeating-linear-gradient(135deg, rgba(255, 255, 255, 0.035) 0 1px, transparent 1px 15px),
        linear-gradient(135deg, rgba(9, 9, 9, 0.98), rgba(46, 8, 8, 0.94) 54%, rgba(12, 12, 12, 0.98));
      box-shadow: 0 30px 95px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(215, 162, 41, 0.10);
    }

    .topbar::after {
      position: absolute;
      inset: auto 24px 0;
      height: 3px;
      border-radius: 999px 999px 0 0;
      background: linear-gradient(90deg, transparent, #d7a229, #8b1010, transparent);
      content: "";
    }

    .brand-zone {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 18px;
      min-width: 0;
    }

    .brand-zone picture {
      display: block;
      flex: 0 0 auto;
      width: clamp(82px, 9vw, 128px);
      height: clamp(82px, 9vw, 128px);
    }

    .brand-logo {
      width: clamp(82px, 9vw, 128px);
      height: clamp(82px, 9vw, 128px);
      flex: 0 0 auto;
      border: 2px solid #d7a229;
      border-radius: 18px;
      background: #050505;
      object-fit: cover;
      box-shadow: 0 18px 38px rgba(0, 0, 0, 0.45), 0 0 32px rgba(139, 16, 16, 0.36);
    }

    .brand-kicker {
      color: #f7d27c;
      border-color: rgba(215, 162, 41, 0.42);
      background: rgba(139, 16, 16, 0.22);
    }

    h1 {
      color: #fff8e8;
      text-transform: uppercase;
      text-shadow: 0 4px 0 rgba(0, 0, 0, 0.48), 0 0 28px rgba(215, 162, 41, 0.16);
    }

    .hero-chip {
      color: #f5d58c;
      border-color: rgba(215, 162, 41, 0.26);
      background: rgba(0, 0, 0, 0.35);
    }

    .progress-card {
      position: relative;
      z-index: 1;
      border-color: rgba(215, 162, 41, 0.28);
      background: rgba(5, 5, 5, 0.72);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08), 0 18px 38px rgba(0, 0, 0, 0.30);
    }

    .progress-label {
      color: #d8c49b;
    }

    .progress-track {
      background: rgba(255, 255, 255, 0.10);
    }

    .progress-track span {
      background: linear-gradient(90deg, #8b1010, #d7a229, #14a46c);
    }

    .stat {
      border-color: rgba(215, 162, 41, 0.22);
      background: rgba(255, 255, 255, 0.06);
    }

    .toolbar {
      border-color: rgba(215, 162, 41, 0.30);
      background: rgba(10, 10, 10, 0.90);
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.42);
    }

    .search {
      color: #fff8e8;
      border-color: rgba(215, 162, 41, 0.22);
      background: rgba(255, 255, 255, 0.06);
    }

    .search-wrap::before {
      border-color: #d7a229;
    }

    .search-wrap::after {
      background: #d7a229;
    }

    button {
      background: linear-gradient(180deg, #a31313, #610808);
      box-shadow: 0 16px 30px rgba(139, 16, 16, 0.34);
    }

    button:hover {
      box-shadow: 0 20px 38px rgba(139, 16, 16, 0.42);
    }

    button.secondary {
      color: #f5d58c;
      border-color: rgba(215, 162, 41, 0.28);
      background: rgba(255, 255, 255, 0.07);
    }

    #clearBtn {
      color: #ffb4a8;
    }

    .table-shell {
      border-color: rgba(215, 162, 41, 0.24);
      background: #080808;
      box-shadow: 0 28px 80px rgba(0, 0, 0, 0.52);
    }

    table {
      min-width: 1580px;
    }

    thead th {
      color: #f5d58c;
      border-bottom-color: rgba(215, 162, 41, 0.30);
      background:
        repeating-linear-gradient(135deg, rgba(255, 255, 255, 0.035) 0 1px, transparent 1px 12px),
        #070707;
    }

    tbody tr {
      color: #fff8e8;
      background: #111111;
    }

    tbody tr:hover {
      box-shadow: inset 0 0 0 999px rgba(215, 162, 41, 0.045);
    }

    tbody tr[data-status="under-process"] {
      background: linear-gradient(90deg, #3a0909 0%, #241010 52%, #141111 100%);
    }

    tbody tr[data-status="completed"] {
      background: linear-gradient(90deg, #092c1b 0%, #0f2519 52%, #111411 100%);
    }

    tbody td {
      border-bottom-color: rgba(215, 162, 41, 0.16);
    }

    tbody tr[data-status="under-process"] td {
      border-bottom-color: rgba(255, 91, 91, 0.22);

<body>
  <main class="app">
    <header class="topbar">

        <button id="backupBtn" class="secondary" type="button">Backup Data</button>

    <section class="table-shell" id="tableShell">

  <template id="rowTemplate">

      </td>
      <td>

      <td>

  <script>
    const storageKey = "video-tracker-rows-v1";
    const contentTypesKey = "video-tracker-content-types-v1";
    const hiddenContentTypesKey = "video-tracker-hidden-content-types-v1";
    const addTypeValue = "__add_new_type__";
    const defaultContentTypes = [
      "Event Based Esports Content",
      "Esports Tips & Tricks Content",
      "Collab Entertainment / Esports Content",
      "Apart from Gaming but for Esports Content"
    ];
    let customContentTypes = loadCustomContentTypes();
    let hiddenContentTypes = loadHiddenContentTypes();

    const tableShell = document.getElementById("tableShell");
    const topScrollbar = document.getElementById("topScrollbar");
    const topScrollbarSizer = document.getElementById("topScrollbarSizer");
    const trackerBody = document.getElementById("trackerBody");
    const rowTemplate = document.getElementById("rowTemplate");
    const addRowBtn = document.getElementById("addRowBtn");
    const clearBtn = document.getElementById("clearBtn");
    const exportBtn = document.getElementById("exportBtn");
    const backupBtn = document.getElementById("backupBtn");
    const restoreBtn = document.getElementById("restoreBtn");
    const restoreInput = document.getElementById("restoreInput");
    const searchInput = document.getElementById("searchInput");
    const emptyState = document.getElementById("emptyState");
    const totalCount = document.getElementById("totalCount");
    const processCount = document.getElementById("processCount");
    const completeCount = document.getElementById("completeCount");
    const completionRate = document.getElementById("completionRate");
    const progressFill = document.getElementById("progressFill");
    const contentTypeMenu = document.createElement("div");
    contentTypeMenu.className = "content-type-menu";
    document.body.appendChild(contentTypeMenu);
    let activeContentTypeSelect = null;

    // ── Undo stack for deleted types ──────────────────────────────
    const deletedTypeHistory = [];

    // ── Toast ─────────────────────────────────────────────────────
    const ctToast = document.createElement("div");
    ctToast.className = "ct-toast";
    document.body.appendChild(ctToast);
    let _toastTimer = null;

    function showToast(msg, withUndo = false) {
      clearTimeout(_toastTimer);
      ctToast.innerHTML = "";
      const txt = document.createElement("span");
      txt.textContent = msg;
      ctToast.appendChild(txt);
      if (withUndo) {
        const btn = document.createElement("button");
        btn.className = "ct-toast-undo";
        btn.textContent = "↩ Undo (Ctrl+Z)";
        btn.addEventListener("click", (e) => { e.stopPropagation(); undoDeleteContentType(); });
        ctToast.appendChild(btn);
      }
      ctToast.classList.add("show");
      _toastTimer = setTimeout(() => ctToast.classList.remove("show"), 4000);
    }

    const starterRows = [
      {
        ideaTitle: "",
        channelName: "",
        videoTitle: "",
        contentType: "",
        rawLink: "",
        editedLink: "",
        thumbnail: "",
        uploadStatus: "Not Uploaded",
        status: "under-process"
      }
    ];

    function getRows() {
      return [...trackerBody.querySelectorAll("tr")];
    }

    function loadCustomContentTypes() {
      try {
        const savedTypes = JSON.parse(localStorage.getItem(contentTypesKey) || "[]");
        return Array.isArray(savedTypes) ? savedTypes.filter(Boolean) : [];
      } catch {
        return [];
      }
    }

    function saveCustomContentTypes() {
      localStorage.setItem(contentTypesKey, JSON.stringify(customContentTypes));
    }

    function loadHiddenContentTypes() {
      try {
        const savedTypes = JSON.parse(localStorage.getItem(hiddenContentTypesKey) || "[]");
        return Array.isArray(savedTypes) ? savedTypes.filter(Boolean) : [];
      } catch {
        return [];
      }
    }

    function saveHiddenContentTypes() {
      localStorage.setItem(hiddenContentTypesKey, JSON.stringify(hiddenContentTypes));
    }

    function getContentTypes() {
      const hidden = new Set(hiddenContentTypes.map((type) => type.toLowerCase()));
      return [...defaultContentTypes, ...customContentTypes]
        .filter((type) => !hidden.has(type.toLowerCase()));
    }

    function ensureContentType(type) {
      const cleanType = String(type || "").trim();
      if (!cleanType) return "";

      hiddenContentTypes = hiddenContentTypes.filter((item) => item.toLowerCase() !== cleanType.toLowerCase());
      saveHiddenContentTypes();

      const exists = getContentTypes().some((item) => item.toLowerCase() === cleanType.toLowerCase());
      if (!exists) {
        customContentTypes.push(cleanType);
        saveCustomContentTypes();
      }

      return cleanType;
    }

    function populateContentTypeSelect(select, selectedValue = "") {
      const value = String(selectedValue || "").trim();
      select.innerHTML = "";

      const placeholder = document.createElement("option");
      placeholder.value = "";
      placeholder.textContent = "Select type";
      select.appendChild(placeholder);

      getContentTypes().forEach((type) => {
        const option = document.createElement("option");
        option.value = type;
        option.textContent = type;
        select.appendChild(option);
      });

      const addOption = document.createElement("option");
      addOption.value = addTypeValue;
      addOption.textContent = "+ Add New Type";
      select.appendChild(addOption);
      select.value = value;
    }

    function hideContentTypeMenu() {
      if (!contentTypeMenu.classList.contains("show")) {
        activeContentTypeSelect = null;
        return;
      }
      contentTypeMenu.classList.remove("show");
      contentTypeMenu.innerHTML = "";
      activeContentTypeSelect = null;
    }

    function deleteContentType(type) {
      const cleanType = String(type || "").trim();
      if (!cleanType || cleanType === addTypeValue) return;

      // Save snapshot for undo
      const wasCustom = customContentTypes.some((t) => t.toLowerCase() === cleanType.toLowerCase());
      const wasDefault = defaultContentTypes.some((t) => t.toLowerCase() === cleanType.toLowerCase());
      const affectedRowData = []; // store {row, oldValue}
      getRows().forEach((row) => {
        const sel = row.querySelector('[data-field="contentType"]');
        if (sel && sel.value.toLowerCase() === cleanType.toLowerCase()) {
          affectedRowData.push({ row, oldValue: sel.value });
        }
      });
      deletedTypeHistory.push({ cleanType, wasCustom, wasDefault, affectedRowData });

      customContentTypes = customContentTypes.filter((t) => t.toLowerCase() !== cleanType.toLowerCase());

      if (defaultContentTypes.some((t) => t.toLowerCase() === cleanType.toLowerCase())) {
        if (!hiddenContentTypes.some((t) => t.toLowerCase() === cleanType.toLowerCase())) {
          hiddenContentTypes.push(cleanType);
        }
      }

      getRows().forEach((row) => {
        const sel = row.querySelector('[data-field="contentType"]');
        if (sel && sel.value.toLowerCase() === cleanType.toLowerCase()) sel.value = "";
      });

      saveCustomContentTypes();
      saveHiddenContentTypes();
      populateAllContentTypeSelects();
      filterRows();
      saveRows();
      hideContentTypeMenu();
      showToast(`"${cleanType}" deleted`, true);
    }

    function undoDeleteContentType() {
      if (!deletedTypeHistory.length) {
        showToast("Nothing to undo");
        return;
      }
      const { cleanType, wasCustom, wasDefault, affectedRowData } = deletedTypeHistory.pop();

      if (wasDefault) {
        hiddenContentTypes = hiddenContentTypes.filter((t) => t.toLowerCase() !== cleanType.toLowerCase());
        saveHiddenContentTypes();
      } else if (wasCustom) {
        if (!customContentTypes.some((t) => t.toLowerCase() === cleanType.toLowerCase())) {
          customContentTypes.push(cleanType);
          saveCustomContentTypes();
        }
      }

      populateAllContentTypeSelects();

      affectedRowData.forEach(({ row, oldValue }) => {
        const sel = row.querySelector('[data-field="contentType"]');
        if (sel) sel.value = oldValue;
      });

      filterRows();
      saveRows();
      showToast(`"${cleanType}" restored ✓`);
    }

    function showContentTypeMenu(select, event) {
      event.preventDefault();
      event.stopPropagation();
      activeContentTypeSelect = select;
      contentTypeMenu.innerHTML = "";

      const title = document.createElement("div");
      title.className = "ct-menu-title";
      title.textContent = "Manage Content Types";
      contentTypeMenu.appendChild(title);

      // ── Add New Type button ────────────────────────────────────
      const addBtn = document.createElement("button");
      addBtn.type = "button";
      addBtn.className = "ct-menu-add";
      addBtn.textContent = "+ Add New Type";
      addBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        hideContentTypeMenu();
        const customType = prompt("Enter new content type:");
        if (!customType || !customType.trim()) return;
        const cleanType = ensureContentType(customType.trim());
        populateAllContentTypeSelects();
        if (select) select.value = cleanType;
        filterRows();
        saveRows();
      });
      contentTypeMenu.appendChild(addBtn);

      // ── Divider ───────────────────────────────────────────────
      const allTypes = getContentTypes();
      if (allTypes.length > 0) {
        const div = document.createElement("div");
        div.className = "ct-menu-hint";
        div.style.cssText = "padding: 3px 5px; margin: 2px 0; font-size: 0.69rem; color: #9d8a5a; border-top: 1px solid rgba(215,162,41,0.18); border-bottom: none;";
        div.textContent = "Or delete a type:";
        contentTypeMenu.appendChild(div);

        allTypes.forEach((type) => {
          const item = document.createElement("div");
          item.className = "ct-menu-item";

          const name = document.createElement("span");
          name.className = "ct-menu-item-name";
          name.textContent = type;
          name.title = type;

          const del = document.createElement("div");
          del.role = "button";
          del.tabIndex = 0;
          del.className = "ct-menu-del";
          del.textContent = "✕";
          del.title = `Delete: ${type}`;
          del.addEventListener("click", (e) => {
            e.stopPropagation();
            deleteContentType(type);
          });
          del.addEventListener("keydown", (e) => {
            if (e.key === "Enter" || e.key === " ") { e.preventDefault(); deleteContentType(type); }
          });

          item.appendChild(name);
          item.appendChild(del);
          contentTypeMenu.appendChild(item);
        });
      }

      const hint = document.createElement("div");
      hint.className = "ct-menu-hint";
      hint.textContent = "Press Ctrl+Z to undo";
      contentTypeMenu.appendChild(hint);

      // ── Delete this Row ───────────────────────────────────────
      const rowDivider = document.createElement("div");
      rowDivider.style.cssText = "border-top: 1px solid rgba(215,162,41,0.22); margin: 4px 0;";
      contentTypeMenu.appendChild(rowDivider);

      const deleteRowBtn = document.createElement("button");
      deleteRowBtn.type = "button";
      deleteRowBtn.className = "ct-menu-delete-row";
      deleteRowBtn.textContent = "🗑 Delete this Row";
      deleteRowBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        hideContentTypeMenu();
        const row = select ? select.closest("tr") : null;
        if (!row) return;
        if (confirm("Delete this row?")) {
          row.remove();
          if (getRows().length === 0) addRow();
          filterRows();
          saveRows();
        }
      });
      contentTypeMenu.appendChild(deleteRowBtn);

      contentTypeMenu.classList.add("show");
      contentTypeMenu.style.width = "280px";
      contentTypeMenu.style.maxHeight = "400px";
      contentTypeMenu.style.overflowY = "auto";

      // Position after render so we get the actual height
      const menuW = 280;
      const padding = 12;
      let left = event.clientX;
      let top = event.clientY;

      // Adjust horizontally if overflowing right
      if (left + menuW + padding > window.innerWidth) {
        left = window.innerWidth - menuW - padding;
      }
      left = Math.max(padding, left);

      contentTypeMenu.style.left = `${left}px`;
      contentTypeMenu.style.top = `${top}px`;

      // After paint, check actual height and flip up if overflowing bottom
      requestAnimationFrame(() => {
        const actualH = contentTypeMenu.offsetHeight;
        if (top + actualH + padding > window.innerHeight) {
          top = Math.max(padding, window.innerHeight - actualH - padding);
          contentTypeMenu.style.top = `${top}px`;
        }
      });
    }

    function populateAllContentTypeSelects() {
      getRows().forEach((row) => {
        const select = row.querySelector('[data-field="contentType"]');
        if (select) {
          populateContentTypeSelect(select, select.value);
        }
      });
    }

    function normaliseUrl(value) {
      const trimmed = value.trim();
      if (!trimmed) return "";
      if (/^(https?:)?\/\//i.test(trimmed) || /^mailto:/i.test(trimmed) || /^data:image\//i.test(trimmed)) return trimmed;
      return `https://${trimmed}`;
    }

    function readRow(row) {
      const data = {};
      row.querySelectorAll("[data-field]").forEach((field) => {
        data[field.dataset.field] = field.value;
      });
      return data;
    }

    function saveRows() {
      const rows = getRows().map(readRow);
      localStorage.setItem(storageKey, JSON.stringify(rows));
      updateStats();
    }

    function getBackupPayload() {
      return {
        app: "Warriorov Content Tracker",
        version: 1,
        exportedAt: new Date().toISOString(),
        rows: getRows().map(readRow),
        customContentTypes,
        hiddenContentTypes
      };
    }

    function downloadBlob(filename, blob) {
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    }

    function backupData() {
      const payload = getBackupPayload();
      const date = new Date().toISOString().slice(0, 10);
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json;charset=utf-8" });
      downloadBlob(`content-tracker-backup-${date}.json`, blob);
    }

    function restoreDataFromBackup(payload) {
      if (!payload || !Array.isArray(payload.rows)) {
        alert("Invalid backup file.");
        return;
      }

      const ok = confirm("Restore backup? Current browser data will be replaced.");
      if (!ok) return;

      customContentTypes = Array.isArray(payload.customContentTypes) ? payload.customContentTypes.filter(Boolean) : [];
      hiddenContentTypes = Array.isArray(payload.hiddenContentTypes) ? payload.hiddenContentTypes.filter(Boolean) : [];
      saveCustomContentTypes();
      saveHiddenContentTypes();

      trackerBody.innerHTML = "";
      payload.rows.forEach((row) => addRow(row));

      if (getRows().length === 0) {
        addRow();
      }

      localStorage.setItem(storageKey, JSON.stringify(getRows().map(readRow)));
      filterRows();
      saveRows();
      requestAnimationFrame(syncTopScrollbarSize);
    }

    function restoreData(file) {
      if (!file) return;

      const reader = new FileReader();
      reader.onload = () => {
        try {
          restoreDataFromBackup(JSON.parse(reader.result));
        } catch {
          alert("Backup file could not be read.");
        } finally {
          restoreInput.value = "";
        }
      };
      reader.readAsText(file);
    }

    function syncTopScrollbarSize() {
      const table = tableShell.querySelector("table");
      if (!table || !topScrollbar || !topScrollbarSizer) return;
      topScrollbarSizer.style.width = `${table.scrollWidth}px`;
      topScrollbar.scrollLeft = tableShell.scrollLeft;
    }

    function updateStats() {
      const rows = getRows();
      const visibleRows = rows.filter((row) => row.style.display !== "none");
      const underProcess = rows.filter((row) => row.dataset.status === "under-process").length;
      const completed = rows.filter((row) => row.dataset.status === "completed").length;
      const completion = rows.length ? Math.round((completed / rows.length) * 100) : 0;

      const isFiltered = visibleRows.length !== rows.length;
      totalCount.textContent = isFiltered
        ? `${visibleRows.length} / ${rows.length} Total`
        : `${rows.length} Total`;
      processCount.textContent = `${underProcess} Under Process`;
      completeCount.textContent = `${completed} Completed`;
      completionRate.textContent = `${completion}%`;
      progressFill.style.width = `${completion}%`;

      const hasVisibleRows = visibleRows.length > 0;
      tableShell.style.display = hasVisibleRows ? "block" : "none";
      if (topScrollbar) {
        topScrollbar.style.display = hasVisibleRows ? "block" : "none";
      }
      emptyState.classList.toggle("show", !hasVisibleRows);
      requestAnimationFrame(syncTopScrollbarSize);
    }

    function updateLinks(row) {
      const rawInput = row.querySelector('[data-field="rawLink"]');
      const editedInput = row.querySelector('[data-field="editedLink"]');
      const links = row.querySelectorAll(".open-link");
      const rawUrl = normaliseUrl(rawInput.value);
      const editedUrl = normaliseUrl(editedInput.value);

      links[0].href = rawUrl || "#";
      links[0].style.pointerEvents = rawUrl ? "auto" : "none";
      links[0].style.opacity = rawUrl ? "1" : "0.45";

      links[1].href = editedUrl || "#";
      links[1].style.pointerEvents = editedUrl ? "auto" : "none";
      links[1].style.opacity = editedUrl ? "1" : "0.45";
    }

    function syncThumbnailInput(row) {
      const hiddenInput = row.querySelector('[data-field="thumbnail"]');
      const visibleInput = row.querySelector(".thumb-url");
      const thumbControl = row.querySelector(".thumb-control");
      const fileInput = row.querySelector(".thumb-file");
      const value = hiddenInput.value;

      if (!visibleInput) return;

      thumbControl.classList.toggle("has-thumbnail", Boolean(value));

      if (/^data:image\//i.test(value)) {
        visibleInput.value = "";
        visibleInput.placeholder = "Local image selected";
        visibleInput.classList.add("has-image");
        if (fileInput) fileInput.value = "";
        return;
      }

      visibleInput.value = value;
      visibleInput.placeholder = "Image URL";
      visibleInput.classList.remove("has-image");
    }

    function openFullscreen(src) {
      document.querySelectorAll(".fs-overlay").forEach((item) => item.remove());
      const overlay = document.createElement("div");
      overlay.className = "fs-overlay";

      const img = document.createElement("img");
      img.src = src;
      img.alt = "Thumbnail fullscreen";

      const closeBtn = document.createElement("button");
      closeBtn.className = "fs-close";
      closeBtn.type = "button";
      closeBtn.setAttribute("aria-label", "Close fullscreen");
      closeBtn.textContent = "X";

      overlay.appendChild(img);
      overlay.appendChild(closeBtn);
      document.body.appendChild(overlay);

      const close = () => overlay.remove();
      closeBtn.addEventListener("click", close);
      overlay.addEventListener("click", (e) => { if (e.target === overlay) close(); });
      document.addEventListener("keydown", function esc(e) {
        if (e.key === "Escape") { close(); document.removeEventListener("keydown", esc); }
      });
    }

    function addThumbnailRemoveButton(preview) {
      // no-op: remove/fullscreen now handled by .thumb-actions buttons
    }

    function updateThumbnail(row) {
      const input = row.querySelector('[data-field="thumbnail"]');
      const preview = row.querySelector(".thumb-preview");
      const url = normaliseUrl(input.value);

      preview.innerHTML = "";

      if (!url) {
        preview.textContent = "Upload thumbnail";
        return;
      }

      const img = document.createElement("img");
      img.src = url;
      img.alt = "Thumbnail preview";
      img.loading = "lazy";
      img.onerror = () => {
        preview.innerHTML = "";
        const errorText = document.createElement("span");
        errorText.textContent = "Image not found";
        preview.appendChild(errorText);
        // Remove has-thumbnail so the URL/file inputs reappear
        row.querySelector(".thumb-control").classList.remove("has-thumbnail");
        addThumbnailRemoveButton(preview);
      };
      preview.appendChild(img);
      addThumbnailRemoveButton(preview);
    }

    function applyStatus(row) {
      const status = row.querySelector('[data-field="status"]').value;
      row.dataset.status = status;
    }

    function attachRowEvents(row) {
      // contextmenu is handled at document level (see bottom of script)

      row.addEventListener("click", (event) => {
        if (event.target.closest(".thumb-remove") || event.target.closest(".thumb-rm")) {
          row.querySelector('[data-field="thumbnail"]').value = "";
          const urlInput = row.querySelector(".thumb-url");
          const fileInput = row.querySelector(".thumb-file");
          if (urlInput) urlInput.value = "";
          if (fileInput) fileInput.value = "";
          syncThumbnailInput(row);
          updateThumbnail(row);
          filterRows();
          saveRows();
          return;
        }

        if (event.target.closest(".thumb-fs")) {
          event.preventDefault();
          event.stopPropagation();
          const src = row.querySelector('[data-field="thumbnail"]').value;
          if (src) openFullscreen(normaliseUrl(src));
          return;
        }
      });

      row.addEventListener("input", (event) => {
        const field = event.target.closest("[data-field]");
        if (!field) return;

        if (field.dataset.field === "thumbnail") {
          updateThumbnail(row);
        }

        if (field.dataset.field === "rawLink" || field.dataset.field === "editedLink") {
          updateLinks(row);
        }

        filterRows();
        saveRows();
      });

      row.addEventListener("change", (event) => {
        const fileInput = event.target.closest(".thumb-file");
        if (fileInput && fileInput.files[0]) {
          const reader = new FileReader();
          reader.onload = () => {
            row.querySelector('[data-field="thumbnail"]').value = reader.result;
            syncThumbnailInput(row);
            updateThumbnail(row);
            filterRows();
            saveRows();
          };
          reader.readAsDataURL(fileInput.files[0]);
          return;
        }

        const field = event.target.closest("[data-field]");
        if (!field) return;

        if (field.dataset.field === "contentType" && field.value === addTypeValue) {
          const customType = prompt("Add new content type");
          if (!customType || !customType.trim()) {
            // User cancelled – reset the select back to the placeholder
            field.value = "";
            filterRows();
            saveRows();
            return;
          }
          const cleanType = ensureContentType(customType.trim());

          populateAllContentTypeSelects();
          field.value = cleanType;
        }

        if (field.dataset.field === "status") {
          applyStatus(row);
        }

        filterRows();
        saveRows();
      });

      row.querySelector(".ct-manage-btn").addEventListener("click", (event) => {
        event.preventDefault();
        event.stopPropagation();
        const sel = row.querySelector('[data-field="contentType"]');
        showContentTypeMenu(sel, event);
      });

      row.querySelector(".remove-row").addEventListener("click", () => {
        row.remove();
        if (getRows().length === 0) {
          addRow();
        }
        filterRows();
        saveRows();
      });

      row.querySelector(".thumb-url").addEventListener("input", (event) => {
        row.querySelector('[data-field="thumbnail"]').value = event.target.value;
        event.target.placeholder = "Image URL";
        event.target.classList.remove("has-image");
        updateThumbnail(row);
        filterRows();
        saveRows();
      });

      row.querySelector(".thumb-url").addEventListener("change", () => {
        syncThumbnailInput(row);
        updateThumbnail(row);
        filterRows();
        saveRows();
      });
    }

    function addRow(data = {}) {
      const row = rowTemplate.content.firstElementChild.cloneNode(true);
      const contentType = ensureContentType(data.contentType);
      populateContentTypeSelect(row.querySelector('[data-field="contentType"]'), contentType);

      row.querySelectorAll("[data-field]").forEach((field) => {
        const key = field.dataset.field;
        if (data[key] !== undefined) {
          field.value = data[key];
        }
      });

      attachRowEvents(row);
      syncThumbnailInput(row);
      applyStatus(row);
      updateLinks(row);
      updateThumbnail(row);
      trackerBody.appendChild(row);
      updateStats();
      return row;
    }

    function filterRows() {
      const query = searchInput.value.trim().toLowerCase();

      getRows().forEach((row) => {
        const rowText = Object.values(readRow(row)).join(" ").toLowerCase();
        row.style.display = rowText.includes(query) ? "" : "none";
      });

      updateStats();
    }

    function loadRows() {
      try {
        const savedRows = JSON.parse(localStorage.getItem(storageKey) || "[]");
        const rows = Array.isArray(savedRows) && savedRows.length ? savedRows : starterRows;
        rows.forEach(addRow);
      } catch {
        starterRows.forEach(addRow);
      }
    }

    function csvEscape(value) {
      return `"${String(value ?? "").replace(/"/g, '""')}"`;
    }

    function exportCsv() {
      const headers = [
        "Idea Title",
        "Channel Name",
        "Video Title",
        "Type of Content",
        "Raw Footage Link",
        "Edited Video Link",
        "Thumbnail Img",
        "Upload Status",
        "Status"
      ];

      const rows = getRows().map(readRow).map((row) => [
        row.ideaTitle,
        row.channelName,
        row.videoTitle,
        row.contentType,
        row.rawLink,
        row.editedLink,
        row.thumbnail,
        row.uploadStatus,
        row.status === "completed" ? "Completed" : "Under Process"
      ]);

      const csv = [headers, ...rows]
        .map((line) => line.map(csvEscape).join(","))
        .join("\n");

      const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "video-tracker.csv";
      link.click();
      setTimeout(() => URL.revokeObjectURL(url), 10000);
    }

    addRowBtn.addEventListener("click", () => {
      const row = addRow();
      saveRows();
      row.querySelector("[data-field]").focus();
    });

    clearBtn.addEventListener("click", () => {
      const ok = confirm("Clear all rows?");
      if (!ok) return;
      trackerBody.innerHTML = "";
      addRow();
      saveRows();
      filterRows();
    });

    exportBtn.addEventListener("click", exportCsv);
    backupBtn.addEventListener("click", backupData);
    restoreBtn.addEventListener("click", () => restoreInput.click());
    restoreInput.addEventListener("change", () => restoreData(restoreInput.files[0]));
    searchInput.addEventListener("input", filterRows);

    let isSyncingScroll = false;

    topScrollbar.addEventListener("scroll", () => {
      if (isSyncingScroll) return;
      isSyncingScroll = true;
      tableShell.scrollLeft = topScrollbar.scrollLeft;
      isSyncingScroll = false;
    });

    tableShell.addEventListener("scroll", () => {
      if (isSyncingScroll) return;
      isSyncingScroll = true;
      topScrollbar.scrollLeft = tableShell.scrollLeft;
      isSyncingScroll = false;
    });

    window.addEventListener("resize", syncTopScrollbarSize);
    // Document-level right-click → show type delete menu on contentType selects
    document.addEventListener("contextmenu", (event) => {
      const sel = event.target.closest('[data-field="contentType"]');
      if (sel) {
        showContentTypeMenu(sel, event);
        return;
      }
      // Close menu on right-click elsewhere
      if (!event.target.closest(".content-type-menu")) {
        hideContentTypeMenu();
      }
    });

    document.addEventListener("click", (event) => {
      // Don't interfere with native select dropdown interactions
      if (event.target.closest('[data-field="contentType"]')) return;
      // Don't close when clicking the manage button (it handles itself)
      if (event.target.closest(".ct-manage-btn")) return;
      if (!event.target.closest(".content-type-menu")) {
        hideContentTypeMenu();
      }
    });
    // Only close on window (page) scroll, not on the table's horizontal scroll
    window.addEventListener("scroll", hideContentTypeMenu, { passive: true });
    window.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        hideContentTypeMenu();
      }
      // Ctrl+Z / Cmd+Z — undo last type deletion
      if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "z") {
        if (deletedTypeHistory.length > 0) {
          event.preventDefault();
          undoDeleteContentType();
        }
      }
    });

    loadRows();
    requestAnimationFrame(syncTopScrollbarSize);
  </script>
</body>
</html>
